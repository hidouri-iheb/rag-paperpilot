[project]
name = "paperpilot"
version = "0.1.0"
description = "Corrective RAG research assistant over AI/ML papers with verified page-level citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
paperpilot = "paperpilot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: real errors, I: import sorting, UP: modern Python syntax, B: common bug patterns
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
