[project]
name = "paperpilot"
version = "0.1.0"
description = "Corrective RAG research assistant over AI/ML papers with verified page-level citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.2",
    "diskcache>=5.6.3",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.19",
    "pydantic-settings>=2.16.2",
    "pymupdf4llm>=1.28,<2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.2.0",
    "tenacity>=9.1.4",
    "transformers>=5.22.1",
]

[project.scripts]
paperpilot = "paperpilot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: real errors, I: import sorting, UP: modern Python syntax, B: common bug patterns
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
